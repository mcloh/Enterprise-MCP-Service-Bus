[project]
name = "emcp-bus"
version = "0.1.0"
description = "Reference implementation of the Enterprise MCP Service Bus (Client-Bound Entitlements architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-instrumentation>=0.65b0",
    "uvicorn>=0.52,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.14,<3",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
dev = [
    "ruff>=0.16.7,<1",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "services", "."]
include = ["emcp_bus*", "example_mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "services"]
