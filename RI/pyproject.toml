[project]
name = "emcp-bus"
version = "0.1.0"
description = "Reference implementation of the Enterprise MCP Service Bus (Client-Bound Entitlements architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-instrumentation>=0.65b0",
    "uvicorn>=0.52,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.14,<3",
    # M3 (EP-11): Service Orchestrator's journey StateGraph + checkpointing.
    "langgraph>=0.6,<0.7",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    # M3 (EP-13): example LLM agent -- OpenAI-compatible client (works
    # against OCI Generative AI's OpenAI-compatible endpoint, verified
    # 2026-09-14, and against OpenAI/Anthropic-compatible gateways generally).
    "openai>=1.50,<2",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
dev = [
    "ruff>=0.16.7,<1",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    # Resolves the e2e suite's previously-documented flakiness (RI/README.md):
    # one process *per test function* means no in-process ASGI server pair
    # ever shares event-loop/socket state with another test's pair. Verified:
    # 22/22 e2e tests pass reliably with `--forked`, where the un-forked
    # suite intermittently failed several. Used by `make test` itself now,
    # not just CI.
    "pytest-forked>=1.7.5,<2",
    # EP-10-T02: property-based tests for the FilteredOfferings subset invariant.
    "hypothesis>=6.100,<7",
    # EP-13-T01's e2e test loads LLM_API_KEY/LLM_BASE_URL/LLM_MODEL from a
    # local, gitignored RI/.env -- convenience only, never a runtime
    # dependency of the RI itself.
    "python-dotenv>=1.2,<2",
    "types-PyYAML>=6.0.12,<7",
    # EP-15-T01: contract tests validate `structured_content` against
    # hand-written schemas via `jsonschema` (already a transitive dep of
    # `mcp[cli]`) -- stubs needed for mypy --strict.
    "types-jsonschema>=4.26,<5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "services", "agents", "."]
include = ["emcp_bus*", "example_mcp_servers*", "example_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "services", "agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "services", "agents"]
